[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/usr/local/bin/hermes-railway-entrypoint gateway run"
# The built-in Hermes dashboard is disabled, so /api/status is gone. /health is
# the Web UI's unauthenticated liveness endpoint on the same PORT.
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
